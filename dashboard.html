<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Dashboard - REST API</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: white; text-align: center; margin-bottom: 25px; font-size: 28px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
    .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; transition: transform 0.2s; }
    .card:hover { transform: translateY(-5px); }
    .card .label { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
    .card .value { font-size: 42px; font-weight: bold; margin: 10px 0; color: #667eea; }
    .card .value.alert { color: #dc3545; }
    .card .unit { font-size: 18px; color: #aaa; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
    .status-online { background: #d4edda; color: #155724; }
    .status-offline { background: #f8d7da; color: #721c24; }
    #alert-banner { display: none; background: #dc3545; color: white; padding: 14px 20px; border-radius: 12px; margin-bottom: 25px; font-weight: 600; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .panel { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 25px; }
    .panel h2 { font-size: 18px; margin-bottom: 15px; color: #444; }
    .controls { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
    .btn { padding: 12px 30px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-on { background: #28a745; color: white; }
    .btn-on:hover { background: #218838; }
    .btn-off { background: #dc3545; color: white; }
    .btn-off:hover { background: #c82333; }
    .btn-save { background: #667eea; color: white; }
    .btn-save:hover { background: #5568d3; }
    input[type=number] { padding: 11px; border: 1px solid #ccc; border-radius: 10px; font-size: 15px; width: 120px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #f8f9fa; color: #666; text-transform: uppercase; font-size: 12px; }
    tr:hover td { background: #f9f9f9; }
    #log { background: #1e1e1e; color: #0f0; font-family: monospace; padding: 15px; border-radius: 10px; max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
    #log .error { color: #f66; }
    #log .info { color: #6af; }
  </style>
</head>
<body>
<div class="container">
  <h1>IoT Dashboard — REST API</h1>

  <div id="alert-banner"></div>

  <div class="cards">
    <div class="card">
      <div class="label">Suhu</div>
      <div class="value" id="suhu">--</div>
      <div class="unit">°C</div>
    </div>
    <div class="card">
      <div class="label">Kelembaban</div>
      <div class="value" id="kelembaban">--</div>
      <div class="unit">%</div>
    </div>
    <div class="card">
      <div class="label">Status Sensor</div>
      <div class="value" style="font-size:22px;">
        <span class="status-badge status-offline" id="status-badge">OFFLINE</span>
      </div>
      <div id="mode" style="font-size:12px;color:#888;margin-top:8px;">Mode: -</div>
    </div>
  </div>

  <div class="panel">
    <h2>Grafik Real-time (20 data terakhir)</h2>
    <canvas id="grafik" height="110"></canvas>
  </div>

  <div class="panel">
    <h2>Kontrol Perangkat</h2>
    <div class="controls">
      <button class="btn btn-on" onclick="kontrol('lamp','on')">Nyalakan Lampu</button>
      <button class="btn btn-off" onclick="kontrol('lamp','off')">Matikan Lampu</button>
    </div>
  </div>

  <div class="panel">
    <h2>Batas Suhu (Threshold)</h2>
    <div class="controls">
      <span>Batas maksimum (°C):</span>
      <input type="number" id="threshold-input" step="0.5" value="30">
      <button class="btn btn-save" onclick="simpanThreshold()">Simpan Batas</button>
    </div>
  </div>

  <div class="panel">
    <h2>10 Data Sensor Terakhir</h2>
    <table>
      <thead>
        <tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr>
      </thead>
      <tbody id="history-body">
        <tr><td colspan="3" style="text-align:center;color:#999;">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="panel">
    <h2>Log Aktivitas</h2>
    <div id="log"></div>
  </div>
</div>

<script>
// Kalau dibuka dari Node-RED (http://localhost:1880/iot) pakai alamat relatif,
// kalau dibuka langsung sebagai file pakai alamat penuh.
const API_BASE = location.protocol === 'file:' ? 'http://localhost:1880/api' : '/api';
const WS_URL = location.protocol === 'file:'
  ? 'ws://localhost:1880/ws/sensor'
  : (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/sensor';
const API_KEY = 'iot-key-2026';

let hist = [];            // riwayat data sensor di sisi browser
let lastReceived = 0;
let thresholdInit = false;
let wasAlert = false;
let pollTimers = [];
let ws = null;
let wsDownLogged = false;
let sourceLogged = false;

function log(msg, type = 'info') {
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  el.innerHTML += `<div class="${type}">[${time}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function setBadge(online) {
  const badge = document.getElementById('status-badge');
  badge.textContent = online ? 'ONLINE' : 'OFFLINE';
  badge.className = 'status-badge ' + (online ? 'status-online' : 'status-offline');
}

function setMode(text) {
  document.getElementById('mode').textContent = 'Mode: ' + text;
}

// status ONLINE/OFFLINE dihitung dari umur data terakhir (timer lokal, bukan request ke server)
function updateBadge() {
  setBadge(lastReceived > 0 && (Date.now() - lastReceived) < 10000);
}
setInterval(updateBadge, 2000);

const chart = (typeof Chart !== 'undefined') ? new Chart(document.getElementById('grafik'), {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label: 'Suhu (°C)', data: [], borderColor: '#e8590c', backgroundColor: '#e8590c', tension: 0.3 },
      { label: 'Kelembaban (%)', data: [], borderColor: '#1c7ed6', backgroundColor: '#1c7ed6', tension: 0.3 }
    ]
  },
  options: { responsive: true, animation: false }
}) : null;

function renderSensor(data, threshold, alert) {
  if (!data || data.suhu === null || data.suhu === undefined) return;
  const suhuEl = document.getElementById('suhu');
  const banner = document.getElementById('alert-banner');
  suhuEl.textContent = data.suhu;
  document.getElementById('kelembaban').textContent = data.kelembaban;
  lastReceived = new Date(data.received).getTime();
  updateBadge();

  if (!thresholdInit && threshold !== undefined) {
    document.getElementById('threshold-input').value = threshold;
    thresholdInit = true;
  }
  if (alert) {
    suhuEl.classList.add('alert');
    banner.style.display = 'block';
    banner.textContent = `PERINGATAN: suhu ${data.suhu} °C melewati batas ${threshold} °C`;
    if (!wasAlert) log(`Peringatan: suhu ${data.suhu} melewati batas ${threshold}`, 'error');
  } else {
    suhuEl.classList.remove('alert');
    banner.style.display = 'none';
  }
  wasAlert = alert;
}

function renderHistory() {
  const tbody = document.getElementById('history-body');
  if (hist.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr>';
    return;
  }
  tbody.innerHTML = hist.slice(-10).reverse().map(d => `
    <tr>
      <td>${new Date(d.received).toLocaleTimeString()}</td>
      <td>${d.suhu}</td>
      <td>${d.kelembaban}</td>
    </tr>
  `).join('');

  if (chart) {
    const last = hist.slice(-20);
    chart.data.labels = last.map(d => new Date(d.received).toLocaleTimeString());
    chart.data.datasets[0].data = last.map(d => d.suhu);
    chart.data.datasets[1].data = last.map(d => d.kelembaban);
    chart.update();
  }
}

// ---------- REST (dipakai sekali di awal, dan sebagai cadangan kalau WebSocket putus) ----------
async function fetchSensor() {
  try {
    const res = await fetch(`${API_BASE}/suhu`);
    const json = await res.json();
    if (json.status === 'success') renderSensor(json.data, json.threshold, json.alert);
  } catch (err) {
    log(`Gagal fetch sensor: ${err.message}`, 'error');
  }
}

async function fetchHistory() {
  try {
    const res = await fetch(`${API_BASE}/history`);
    const json = await res.json();
    hist = json.data || [];
    renderHistory();
    if (!sourceLogged && json.source) {
      log(`History dimuat dari ${json.source} (${json.count} data)`, 'info');
      sourceLogged = true;
    }
  } catch (err) {
    log(`Gagal fetch history: ${err.message}`, 'error');
  }
}

function startPolling() {
  if (pollTimers.length) return;
  fetchSensor();
  fetchHistory();
  pollTimers = [setInterval(fetchSensor, 3000), setInterval(fetchHistory, 5000)];
}

function stopPolling() {
  pollTimers.forEach(clearInterval);
  pollTimers = [];
}

// ---------- WebSocket ----------
function connectWS() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    wsDownLogged = false;
    stopPolling();
    setMode('WebSocket (tanpa polling)');
    log('WebSocket terhubung, data di-push dari server', 'info');
    fetchHistory();   // sekali saja, untuk mengisi riwayat awal
    fetchSensor();
  };

  ws.onmessage = (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === 'sensor') {
      hist.push(m.data);
      if (hist.length > 50) hist.shift();
      renderSensor(m.data, m.threshold, m.alert);
      renderHistory();
    }
  };

  ws.onclose = () => {
    setMode('Polling (WebSocket terputus)');
    if (!wsDownLogged) {
      log('WebSocket terputus, kembali ke polling', 'error');
      wsDownLogged = true;
    }
    startPolling();
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => { ws.close(); };
}

// ---------- Kontrol & threshold ----------
async function kontrol(device, action) {
  try {
    const res = await fetch(`${API_BASE}/kontrol`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
      body: JSON.stringify({ device, action })
    });
    const json = await res.json();
    if (json.status === 'success') {
      log(`Perintah terkirim: ${device} → ${action}`, 'info');
    } else {
      log(`Gagal: ${json.message}`, 'error');
    }
  } catch (err) {
    log(`Error kontrol: ${err.message}`, 'error');
  }
}

async function simpanThreshold() {
  const max = parseFloat(document.getElementById('threshold-input').value);
  try {
    const res = await fetch(`${API_BASE}/threshold`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
      body: JSON.stringify({ max })
    });
    const json = await res.json();
    if (json.status === 'success') {
      log(`Batas suhu diubah menjadi ${json.max} °C`, 'info');
    } else {
      log(`Gagal: ${json.message}`, 'error');
    }
  } catch (err) {
    log(`Error threshold: ${err.message}`, 'error');
  }
}

log('Dashboard dimulai, menghubungkan WebSocket...');
connectWS();
</script>
</body>
</html>
